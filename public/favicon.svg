<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Base background with rounded aesthetic -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Inner border accent -->
  <rect x="36" y="36" width="440" height="440" rx="80" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />

  <!-- IAN (Top) -->
  <text 
    x="256" 
    y="228" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Space Grotesk', 'Segoe UI', Roboto, sans-serif" 
    font-weight="900" 
    font-size="172" 
    letter-spacing="14" 
    fill="#FFFFFF"
  >IAN</text>

  <!-- Architectural Timber Divider Line -->
  <rect x="96" y="262" width="320" height="8" rx="4" fill="url(#lineGrad)" />

  <!-- ART (Below) -->
  <text 
    x="256" 
    y="410" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Space Grotesk', 'Segoe UI', Roboto, sans-serif" 
    font-weight="800" 
    font-size="124" 
    letter-spacing="24" 
    fill="#E4E4E7"
  >ART</text>
</svg>
